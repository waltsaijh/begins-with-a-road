		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: white; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; z-index: 1; background: white; display: flex; align-items: center; justify-content: center; }
/* Same geometry as intro_logos.tscn under the engine's canvas_items scaling. */
#status { --unit: min(calc(100vw / 1152), calc(100vh / 648)); }
#status-logos { position: fixed; left: 50%; top: calc(50% - 140 * var(--unit)); transform: translateX(-50%); display: flex; gap: calc(120 * var(--unit)); }
@keyframes status-logos-in { from { opacity: 0; } }
#status-logos { animation: status-logos-in 0.8s ease-out; }
#status-logos img { display: block; opacity: 0.75; width: calc(200 * var(--unit)); height: calc(200 * var(--unit)); }
#status-logos img:first-child { transform: scale(0.75); }
#status-notice { display: none; position: fixed; left: 24px; right: 24px; bottom: 24px; text-align: center; overflow-wrap: anywhere; white-space: normal; font: 300 14px/1.5 "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #70454a; }
</style>

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');

    const english = navigator.language.toLowerCase().startsWith('en');
    const failureTitle = english ? 'Unable to start game' : '無法啟動遊戲';
    document.documentElement.lang = english ? 'en' : 'zh-Hant';
    let engineStarted = false;
    let canvasPresented = false;
    // Never reveal an empty canvas between the engine promise and its first draw.
    function dismissWhenPresented() {
        if (engineStarted && canvasPresented && initializing) {
            requestAnimationFrame(() => setStatusMode('hidden'));
        }
    }
    window.roadStartupPresented = () => {
        canvasPresented = true;
        dismissWhenPresented();
    };
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(failureTitle + '\n' + err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(failureTitle + '\n' + err);
		} else {
			setStatusNotice(failureTitle + '\nAn unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({}).then(() => {
            engineStarted = true;
            dismissWhenPresented();
		}, displayFailureNotice);
	}
}());
