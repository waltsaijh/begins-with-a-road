[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,tools/*,addons/*,native/*,reports/*,docs/*,build/*,*.md,*.blend,*.blend1,*.psd,*.zip,*.py,*.ps1,*.cjs,*.cpp,*.hpp,*.h,*.lib,*.exp,*.pdb,*.dll,scenes/9x9.tscn,scenes/11x11big.tscn,scenes/relics/relic_inventory.tscn,scenes/levels/wave_timeline_act.tscn,scripts/tower_tile_editor/editor.gd,scripts/tower_tile_editor/grid.gd,scripts/tower_tile_editor/combinations.gd,scripts/tower_tile_editor/candidate_preview.gd"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/custom_html_shell="res://assets/web/shell.html"
progressive_web_app/enabled=false
